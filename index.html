  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCueKXS0FR-MRDDqcJCanVBl_U4w11FJmg",
      authDomain: "afp-app-3fdf1.firebaseapp.com",
      projectId: "afp-app-3fdf1",
      storageBucket: "afp-app-3fdf1.firebasestorage.app",
      messagingSenderId: "274409312091",
      appId: "1:274409312091:web:ea848342cbe7b41a7c947e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const messaging = getMessaging(app);

    const contenido = document.getElementById("contenido");
    let eventos = [];
    const menu = document.getElementById("menu");
    const header = document.getElementById("header");
    const loader = document.getElementById("loaderScreen");
    let usuarioActual = null;
    let deferredPrompt = null;
    let listaParticipantes = [];
    let tieneCabezasGlobal = false;

    window.mostrarLogin = mostrarLogin;
    window.mostrarRegistro = mostrarRegistro;
    window.registrar = registrar;
    window.login = login;
    window.cambiarPantalla = cambiarPantalla;

    window.pantallaCrearEvento = function () {
      pantallaCrearEvento();
    };

    window.crearEvento = crearEvento;
    window.verEvento = verEvento;
    window.volverInicio = volverInicio;
    window.eliminarEvento = eliminarEvento;
    window.pantallaPlanillas = pantallaPlanillas;
    window.abrirPlanilla = abrirPlanilla;
    window.agregarParticipante = agregarParticipante;
    window.seleccionarTipoParticipante = seleccionarTipoParticipante;
    window.eliminarParticipante = eliminarParticipante;
    window.cerrarInscripcion = cerrarInscripcion;
    window.seleccionarGanador = seleccionarGanador;
    window.siguienteRonda = siguienteRonda;
    window.obtenerNivelCompetencia = obtenerNivelCompetencia;
    window.abrirRanking = abrirRanking;

    onAuthStateChanged(auth, async (user) => {

      try {

        if (user) {

          const docRef = doc(db, "usuarios", user.uid);
          const docSnap = await getDoc(docRef);

          let data = null;

          if (docSnap.exists()) {
            data = docSnap.data();
            usuarioActual = data;
            document.getElementById("usernameDisplay").innerText = data.username;
          }

          cambiarPantalla("inicio");
          menu.style.display = "flex";

          const btnOrg = document.getElementById("btnOrganizadores");

          // 🔥 VALIDACIÓN SEGURA
          if (data && data.rol === "organizador") {
            btnOrg.style.display = "block";
          } else {
            btnOrg.style.display = "none";
          }

        } else {

          contenido.innerHTML = `
            <h2>Bienvenido</h2>

            <button onclick="mostrarLogin()" style="width:100%; padding:12px; margin-bottom:10px;">
              Iniciar Sesión
            </button>

            <button onclick="mostrarRegistro()" style="width:100%; padding:12px;">
              Registrarse
            </button>
          `;

          menu.style.display = "none";
        }

      } catch (error) {
        console.error("Error de sesión:", error);
        contenido.innerHTML = "<p>Error cargando la app</p>";
      }

      // 🔥 ESTO SIEMPRE SE EJECUTA
      loader.style.display = "none";
      header.style.display = "flex";
      contenido.style.display = "block";

    });

    function mostrarLogin() {
      contenido.innerHTML = `
        <h3>Iniciar Sesión</h3>
        <input id="loginEmail" placeholder="Email" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <input id="loginPassword" type="password" placeholder="Contraseña" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <button onclick="login()" style="width:100%; padding:10px;">Entrar</button>
      `;
    }

    function mostrarRegistro() {
      contenido.innerHTML = `
        <h3>Registrarse</h3>
        <input id="registerUsername" placeholder="Nombre de usuario" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <input id="registerEmail" placeholder="Email" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <input id="registerPassword" type="password" placeholder="Contraseña" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <input id="registerPassword2" type="password" placeholder="Repetir contraseña" style="width:100%; padding:10px; margin-bottom:10px; box-sizing:border-box;">
        <button onclick="registrar()" style="width:100%; padding:10px;">Crear cuenta</button>
        <p id="mensajeRegistro"></p>
      `;
    }

    async function registrar() {
      const username = document.getElementById("registerUsername").value;
      const email = document.getElementById("registerEmail").value;
      const pass = document.getElementById("registerPassword").value;
      const pass2 = document.getElementById("registerPassword2").value;
      const mensaje = document.getElementById("mensajeRegistro");

      mensaje.innerText = "Creando cuenta...";
      mensaje.style.color = "yellow";

      if (pass !== pass2) {
        mensaje.innerText = "Las contraseñas no coinciden";
        mensaje.style.color = "red";
        return;
      }

      try {
        const snapshot = await getDocs(collection(db, "usuarios"));
        let existe = false;

        snapshot.forEach(d => {
          if (d.data().username === username) existe = true;
        });

        if (existe) {
          mensaje.innerText = "Nombre de usuario ya usado";
          mensaje.style.color = "red";
          return;
        }

        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);

        await setDoc(doc(db, "usuarios", userCredential.user.uid), {
          username,
          email,
          rol: "publico"
        });

        await auth.signOut();

        let t = 5;
        mensaje.style.color = "lightgreen";

        const i = setInterval(() => {
          mensaje.innerText = `Cuenta creada con éxito, espere (${t})`;
          t--;
          if (t < 0) {
            clearInterval(i);
            mostrarLogin();
          }
        }, 1000);

      } catch (error) {
        mensaje.innerText = error.code === "auth/email-already-in-use"
          ? "Correo ya usado"
          : error.message;
        mensaje.style.color = "red";
      }
    }

    async function login() {
      const email = document.getElementById("loginEmail").value;
      const pass = document.getElementById("loginPassword").value;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        setTimeout(() => cambiarPantalla("inicio"), 500);
      } catch (error) {
        alert(error.message);
      }
    }

    function cambiarPantalla(p) {

      if (p === "inicio") {
        cargarEventos();
        return;
      }

      if (p === "eventos") {

        let html = `
    <h2>Eventos</h2>

    <div onclick="abrirRanking()" style="
      background:#111;
      border:1px solid #222;
      border-radius:14px;
      padding:16px;
      margin-top:15px;
      text-align:left;
      cursor:pointer;
    ">

      <div style="
        font-size:18px;
        font-weight:900;
        margin-bottom:6px;
      ">
        Ranking
      </div>

      <div style="
        color:#888;
        font-size:13px;
      ">
        Ver ranking semanal, mensual y anual
      </div>

    </div>
  `;

        cambiarContenidoConAnimacion(html, "adelante");
        return;
      }

      if (p === "organizadores") {

        let html = "<h2>Panel de Organizador</h2>";

        html += `
    <div style="
  background:#111;
  border:1px solid #222;
  padding:16px;
  border-radius:16px;
  margin-bottom:15px;
  text-align:left;
  box-shadow:0 6px 20px rgba(0,0,0,0.6);
">

  <div style="font-size:16px; font-weight:800; margin-bottom:8px;">
    Crear evento
  </div>

  <div style="font-size:13px; color:#aaa; margin-bottom:12px;">
    Publicá una nueva fecha para tu competencia
  </div>

  <button onclick="pantallaCrearEvento()" style="
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-weight:bold;
  ">
    Crear
  </button>

</div>

<div style="
  background:#111;
  border:1px solid #222;
  padding:16px;
  border-radius:16px;
  margin-bottom:15px;
  text-align:left;
  box-shadow:0 6px 20px rgba(0,0,0,0.6);
">

  <div style="font-size:16px; font-weight:800; margin-bottom:8px;">
    Crear planilla
  </div>

  <div style="font-size:13px; color:#aaa; margin-bottom:12px;">
    Administrá participantes y cruces del evento
  </div>

  <button onclick="pantallaPlanillas()" style="
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-weight:bold;
  ">
    Abrir
  </button>

</div>
  `;

        cambiarContenidoConAnimacion(html, "adelante");
        return;
      }

      let html = `
        <h2>Eventos</h2>
        <p>Lista de eventos próximamente</p>
      `;

      if (usuarioActual && usuarioActual.rol === "organizador") {
        html += `
          <button onclick="pantallaCrearEvento()" style="width:100%; padding:12px; margin-top:15px;">
            Crear Evento
          </button>
        `;
      }

      cambiarContenidoConAnimacion(html, "adelante");
    }

    function cambiarContenidoConAnimacion(nuevoHTML, direccion = "adelante") {

      // posición inicial (salida)
      contenido.style.transition = "transform 0.25s ease, opacity 0.2s ease";

      if (direccion === "adelante") {
        contenido.style.transform = "translateX(-30px)";
      } else {
        contenido.style.transform = "translateX(30px)";
      }

      contenido.style.opacity = "0";

      setTimeout(() => {

        // cambiar contenido
        contenido.innerHTML = nuevoHTML;

        // posición de entrada (desde el lado opuesto)
        contenido.style.transition = "none";

        if (direccion === "adelante") {
          contenido.style.transform = "translateX(30px)";
        } else {
          contenido.style.transform = "translateX(-30px)";
        }

        contenido.style.opacity = "0";

        // activar animación
        requestAnimationFrame(() => {
          contenido.style.transition = "transform 0.25s ease, opacity 0.2s ease";
          contenido.style.transform = "translateX(0)";
          contenido.style.opacity = "1";
        });

      }, 180);
    }

    async function cargarEventos() {

      const querySnapshot = await getDocs(collection(db, "eventos"));



      eventos = [];

      querySnapshot.forEach(docSnap => {
        eventos.push({
          id: docSnap.id,
          ...docSnap.data()
        });
      });

      eventos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
      eventos = eventos.filter(e => esEventoActivo(e.fecha));

      let html = "<h2>Eventos</h2>";

      if (eventos.length === 0) {
        html += "<p>No hay eventos todavía</p>";
      }

      eventos.forEach((e, i) => {

        html += `
    <div data-id="${e.id}" class="eventoCard" style="
      background:#151515;
      border:1px solid #242424;
      border-left:6px solid ${e.color};
      border-radius:14px;
      padding:14px;
      margin-bottom:12px;
      cursor:pointer;
      text-align:left;
    ">

      <div style="
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
">

  <div style="
    color:${e.color};
    font-size:18px;
    font-weight:900;
  ">
    ${e.competencia}
  </div>

  ${obtenerEstadoEvento(e.fecha) ? `
    <div style="
      background:${obtenerEstadoEvento(e.fecha) === "HOY" ? "#1eff8a" : "#ffd400"};
      color:#000;
      font-size:10px;
      font-weight:900;
      padding:4px 8px;
      border-radius:999px;
      flex-shrink:0;
    ">
      ${obtenerEstadoEvento(e.fecha)}
    </div>
  ` : ""}

</div>

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
        gap:10px;
      ">

        <div>

          <div style="
            color:#fff;
            font-size:16px;
            font-weight:700;
            margin-bottom:4px;
          ">
            ${e.ubicacion}
          </div>

          <div style="
            color:#9a9a9a;
            font-size:13px;
            font-weight:500;
          ">
            ${formatearHora(e.horario)} HS • $${e.inscripcion}
          </div>

        </div>

        <div style="text-align:right;">

          <div style="
            color:#fff;
            font-size:15px;
            font-weight:800;
            margin-bottom:4px;
          ">
            ${e.modalidad.toUpperCase()}
          </div>

          <div style="
            color:#8a8a8a;
            font-size:12px;
            font-weight:600;
          ">
            ${formatearFecha(e.fecha)}
          </div>

        </div>

      </div>

    </div>
  `;

      });

      contenido.innerHTML = html;
    }

    async function crearEvento() {

      const ubicacion = document.getElementById("ubicacion").value;
      const horario = document.getElementById("horario").value;
      const fecha = document.getElementById("fecha").value;
      const modalidad = document.getElementById("modalidad").value;

    function formatearFecha(fecha) {

      if (!fecha) return "";

      const meses = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

      const [year, month, day] = fecha.split("-");

      return parseInt(day) + " " + meses[parseInt(month) - 1];
    }

    function formatearHora(rango) {
      return rango.split(" - ")[0];
    }

    function obtenerEstadoEvento(fecha) {

      if (!fecha) return null;

      const [y, m, d] = fecha.split("-");

      const hoy = new Date();
      const evento = new Date(y, m - 1, d); // 🔥 LOCAL (NO UTC)

      hoy.setHours(0, 0, 0, 0);
      evento.setHours(0, 0, 0, 0);

      const diff = (evento - hoy) / (1000 * 60 * 60 * 24);

      if (diff === 0) return "HOY";
      if (diff === 1) return "MAÑANA";

      return null;
    }

    function esEventoActivo(fecha) {

      if (!fecha) return false;

      const [y, m, d] = fecha.split("-");

      const hoy = new Date();
      const evento = new Date(y, m - 1, d); // 🔥 LOCAL

      hoy.setHours(0, 0, 0, 0);
      evento.setHours(0, 0, 0, 0);

      return evento >= hoy;
    }

      const total = listaParticipantes.length;

      if (total < 8) {

      let cantidadBatallas = 4;

      if (total >= 16 && total <= 31) {

      if (total >= 32) {
        cantidadBatallas = 8;
      }

      const batallas = generarDistribucion(

      rondaActual = batallas;

    function generarDistribucion(participantes, cantidadBatallas) {

      let cabezas = participantes.filter(
        p => p.tipo === "cabeza"
      );

      let normales = participantes.filter(
        p => p.tipo !== "cabeza"
      );

      cabezas = shuffleArray(cabezas);
      normales = shuffleArray(normales);

      let batallas = Array.from(
        { length: cantidadBatallas },
        () => []
      );

      // PRIMERO CABEZAS
      cabezas.forEach((p, index) => {

        if (index < cantidadBatallas) {
          batallas[index].push(p);
        } else {

          let menor = batallas.reduce((a, b) =>
            a.length <= b.length ? a : b
          );

          menor.push(p);
        }
      });

      // DESPUÉS NORMALES
      normales.forEach(p => {

        let menorCantidad = Math.min(
          ...batallas.map(b => b.length)
        );

        let posibles = batallas.filter(
          b => b.length === menorCantidad
        );

        let batalla =
          posibles[
          Math.floor(Math.random() * posibles.length)
          ];

        batalla.push(p);
      });

      return batallas;
    }

    function shuffleArray(array) {

      let copia = [...array];

      for (let i = copia.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copia[i], copia[j]] =
          [copia[j], copia[i]];
      }

      return copia;
    }

        </div>
      `;
        });

        html += `
      </div>
    `;
      });

      const todasSeleccionadas =
        Object.keys(ganadoresSeleccionados).length
        === rondaActual.length;

      if (todasSeleccionadas) {

        html += `
      <button onclick="siguienteRonda()" style="
        width:100%;
        padding:14px;
        background:#1eff8a;
        color:#000;
        border:none;
        border-radius:12px;
        font-weight:900;
        margin-top:10px;
      ">
        Siguiente ronda
      </button>
    `;
      }

      html += `
    <button onclick="pantallaPlanillas()" style="
      width:100%;
      padding:12px;
      background:#222;
      color:#fff;
      border:none;
      border-radius:10px;
      margin-top:10px;
    ">
      Volver
    </button>
  `;

      cambiarContenidoConAnimacion(html, "adelante");
    }

    function seleccionarGanador(
      batallaIndex,
      participanteIndex
    ) {

      ganadoresSeleccionados[batallaIndex] =
        participanteIndex;

      renderRonda();
    }

    function siguienteRonda() {

      let ganadores = [];
      let eliminados = [];

      rondaActual.forEach((batalla, batallaIndex) => {

        const index =
          ganadoresSeleccionados[batallaIndex];

        ganadores.push(
          batalla[index]
        );
        batalla.forEach((participante, i) => {

          if (i !== index) {
            eliminados.push(participante);
          }

        });
      });

      if (faseActual === "octavos") {
        historialPosiciones.octavos.push(...eliminados);
      }

      if (faseActual === "cuartos") {
        historialPosiciones.cuartos.push(...eliminados);
      }

      if (faseActual === "semifinal") {
        historialPosiciones.semifinal.push(...eliminados);
      }

      if (faseActual === "final") {

        historialPosiciones.subcampeon.push(
          eliminados[0]
        );

        historialPosiciones.campeon.push(
          ganadores[0]
        );
      }
      // CAMPEÓN
      if (ganadores.length === 1) {

        historialPosiciones.campeon.forEach(p => {
          guardarRanking(
            p,
            "campeon",
            0,
            0
          );
        });

        historialPosiciones.subcampeon.forEach(p => {
          guardarRanking(
            p,
            "subcampeon",
            1,
            1
          );
        });

        historialPosiciones.semifinal.forEach(p => {
          guardarRanking(
            p,
            "semifinal",
            2,
            1
          );
        });

        historialPosiciones.cuartos.forEach(p => {
          guardarRanking(
            p,
            "cuartos",
            1,
            1
          );
        });

        historialPosiciones.octavos.forEach(p => {
          guardarRanking(
            p,
            "octavos",
            0,
            1
          );
        });

        mostrarCampeon(ganadores[0]);
        return;
      }

      // NUEVA RONDA
      let nuevasBatallas = [];

      for (let i = 0; i < ganadores.length; i += 2) {

        if (ganadores[i + 1]) {

          nuevasBatallas.push([
            ganadores[i],
            ganadores[i + 1]
          ]);

        }
      }

      rondaActual = nuevasBatallas;
      ganadoresSeleccionados = {};

      renderRonda();
    }

    function mostrarCampeon(campeon) {

      let html = `
    <h2>Campeón</h2>

    <div style="
      background:#1eff8a;
      color:#000;
      border-radius:18px;
      padding:24px;
      margin-top:20px;
      text-align:center;
    ">

      <div style="
        font-size:14px;
        margin-bottom:10px;
      ">
        GANADOR
      </div>

      ${campeon.integrantes.map(nome => `
        <div style="
          font-size:22px;
          font-weight:900;
          margin-bottom:8px;
        ">
          ${nome}
        </div>
      `).join("")}

    </div>

    <button onclick="pantallaPlanillas()" style="
      width:100%;
      padding:12px;
      background:#222;
      color:#fff;
      border:none;
      border-radius:10px;
      margin-top:20px;
    ">
      Volver
    </button>
  `;

      cambiarContenidoConAnimacion(html, "adelante");
    }

    function obtenerNivelCompetencia(nombre) {

      if (nombre === "Liga Litoral") {
        return 1;
      }

      if (
        nombre === "Homies" ||
        nombre === "La Casa del Free"
      ) {
        return 2;
      }

      if (
        nombre === "Wasted" ||
        nombre === "Rappandemia"
      ) {
        return 3;
      }

      if (
        nombre === "Sin Korte" ||
        nombre === "Código Verde"
      ) {
        return 4;
      }

      return 4;
    }

    function obtenerColorCompetencia(
      competencia
    ) {

      if (competencia === "Liga Litoral") {
        return "#FF4C00";
      }

      if (competencia === "Homies") {
        return "#0DBFA1";
      }

      if (competencia === "La Casa del Free") {
        return "#FFF200";
      }

      if (competencia === "Wasted") {
        return "#212121";
      }

      if (competencia === "Rappandemia") {
        return "#440069";
      }

      if (competencia === "Sin Korte") {
        return "#00BFFF";
      }

      if (competencia === "Código Verde") {
        return "#00C853";
      }

      return "#ffffff";
    }

    function obtenerPuntos(nivel, posicion) {

      const tablas = {

        1: {
          campeon: 5,
          subcampeon: 4,
          semifinal: 3,
          cuartos: 2,
          octavos: 1
        },

        2: {
          campeon: 4,
          subcampeon: 3,
          semifinal: 2,
          cuartos: 1,
          octavos: 0.5
        },

        3: {
          campeon: 3,
          subcampeon: 2,
          semifinal: 1.5,
          cuartos: 1,
          octavos: 0.4
        },

        4: {
          campeon: 2,
          subcampeon: 1.5,
          semifinal: 1,
          cuartos: 0.5,
          octavos: 0.2
        }

      };

      return tablas[nivel]?.[posicion] || 0;
    }

    async function guardarRanking(
      participante,
      posicion,
      victorias,
      derrotas
    ) {

      if (!eventoPlanillaActual) return;

      const nivel = obtenerNivelCompetencia(
        eventoPlanillaActual.competencia
      );

      const puntos = obtenerPuntos(
        nivel,
        posicion
      );

      const fecha = new Date()
        .toISOString()
        .split("T")[0];

      for (const nombre of participante.integrantes) {

        const q = query(
          collection(db, "ranking"),
          where("nombre", "==", nombre)
        );

        const snap = await getDocs(q);

        // NO EXISTE
        if (snap.empty) {

          await addDoc(collection(db, "ranking"), {

            nombre,

            puntos,
            puntosPorCompetencia: {
              [eventoPlanillaActual.competencia]: puntos
            },

            victorias,

            derrotas,

            competencias: 1,

            color:
              eventoPlanillaActual.color,

            competencia:
              eventoPlanillaActual.competencia,

            nivel,

            posicion,

            modalidad:
              eventoPlanillaActual.modalidad,

            fecha,

            timestamp: Date.now()
          });

        }

        // YA EXISTE
        else {

          const docActual = snap.docs[0];

          const data = docActual.data();
          let puntosPorCompetencia =
            data.puntosPorCompetencia || {};

          puntosPorCompetencia[
            eventoPlanillaActual.competencia
          ] =
            (
              puntosPorCompetencia[
              eventoPlanillaActual.competencia
              ] || 0
            )
            + puntos;

          let competenciaDominante =
            eventoPlanillaActual.competencia;

          let maxPuntos = 0;

          Object.entries(
            puntosPorCompetencia
          ).forEach(([comp, pts]) => {

            if (pts > maxPuntos) {

              maxPuntos = pts;
              competenciaDominante = comp;
            }

          });

          await updateDoc(docActual.ref, {

            puntos:
              (data.puntos || 0) + puntos,

            victorias:
              (data.victorias || 0) + victorias,

            derrotas:
              (data.derrotas || 0) + derrotas,

            competencias:
              (data.competencias || 0) + 1,

            color:
              obtenerColorCompetencia(
                competenciaDominante
              ),

            competencia:
              eventoPlanillaActual.competencia,

            nivel,

            posicion,

            modalidad:
              eventoPlanillaActual.modalidad,

            fecha,

            puntosPorCompetencia,
            timestamp: Date.now()
          });
        }
      }
    }

    function mostrarNotificacion(texto) {

      const notif = document.createElement("div");

      notif.style = `
    position:fixed;
    bottom:110px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1a1a1a;
    border:1px solid #333;
    padding:12px 18px;
    border-radius:12px;
    color:#fff;
    font-size:14px;
    z-index:9999;
    opacity:0;
    transition:all 0.3s ease;
    box-shadow:0 6px 20px rgba(0,0,0,0.6);
  `;

      notif.innerText = texto;

      document.body.appendChild(notif);

      // entrada
      setTimeout(() => {
        notif.style.opacity = "1";
        notif.style.transform = "translateX(-50%) translateY(0)";
      }, 10);

      // salida
      setTimeout(() => {
        notif.style.opacity = "0";
        notif.style.transform = "translateX(-50%) translateY(20px)";
      }, 2000);

      // eliminar
      setTimeout(() => {
        notif.remove();
      }, 2500);
    }

    async function abrirRanking(tipo = "anual") {

      const snapshot = await getDocs(
        collection(db, "ranking")
      );

      let ranking = [];

      const ahora = new Date();

      const inicioSemana = new Date(ahora);
      inicioSemana.setDate(
        ahora.getDate() - ahora.getDay()
      );

      const inicioMes = new Date(
        ahora.getFullYear(),
        ahora.getMonth(),
        1
      );

      const inicioAnio = new Date(
        ahora.getFullYear(),
        0,
        1
      );

      snapshot.forEach(doc => {

        const data = doc.data();

        const fechaJugador =
          new Date(data.timestamp);

        if (tipo === "semanal") {

          if (fechaJugador >= inicioSemana) {
            ranking.push(data);
          }

        }

        else if (tipo === "mensual") {

          if (fechaJugador >= inicioMes) {
            ranking.push(data);
          }

        }

        else {

          if (fechaJugador >= inicioAnio) {
            ranking.push(data);
          }

        }

      });

      ranking.sort((a, b) => b.puntos - a.puntos);

      let html = `
    <h2>Ranking Anual</h2>

    <div style="
  display:flex;
  gap:10px;
  margin-bottom:15px;
">

  <button
    onclick="abrirRanking('anual')"
    style="
      flex:1;
      padding:10px;
      border:none;
      border-radius:10px;
      background:${tipo === "anual" ? "#fff" : "#222"};
      color:${tipo === "anual" ? "#000" : "#fff"};
      font-weight:800;
    "
  >
    Anual
  </button>

  <button
    onclick="abrirRanking('mensual')"
    style="
      flex:1;
      padding:10px;
      border:none;
      border-radius:10px;
      background:${tipo === "mensual" ? "#fff" : "#222"};
      color:${tipo === "mensual" ? "#000" : "#fff"};
      font-weight:800;
    "
  >
    Mensual
  </button>

  <button
    onclick="abrirRanking('semanal')"
    style="
      flex:1;
      padding:10px;
      border:none;
      border-radius:10px;
      background:${tipo === "semanal" ? "#fff" : "#222"};
      color:${tipo === "semanal" ? "#000" : "#fff"};
      font-weight:800;
    "
  >
    Semanal
  </button>

</div>
  `;

      if (ranking.length === 0) {

        html += `
      <div style="
        color:#777;
        margin-top:20px;
      ">
        No hay ranking todavía
      </div>
    `;
      }

      const inicioPeriodo =
        tipo === "anual"
          ? inicioAnio
          : tipo === "mensual"
            ? inicioMes
            : inicioSemana;

      const diasTotales = Math.max(
        1,
        Math.floor(
          (ahora - inicioPeriodo)
          / (1000 * 60 * 60 * 24)
        )
      );

      const semanasTotales =
        diasTotales / 7;

      const mesesTotales =
        diasTotales / 30;

      ranking.forEach((p, index) => {

        html += `
      <div style="
        background:#111;
        border:1px solid #222;
        border-left:6px solid ${p.color || "#fff"};
        border-radius:14px;
        padding:14px;
        margin-bottom:10px;
        text-align:left;
      ">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:8px;
        ">

          <div style="
            font-size:18px;
            font-weight:900;
          ">
            #${index + 1}
          </div>

          <div style="
            font-size:22px;
            font-weight:900;
            color:${p.color || "#fff"};
          ">
            ${p.puntos || 0}
          </div>

        </div>

        <div style="
          font-size:16px;
          font-weight:800;
          margin-bottom:6px;
        ">
          ${p.nombre || "Sin nombre"}
        </div>

        <div style="
  color:#888;
  font-size:13px;
  line-height:1.6;
">

  Victorias: ${p.victorias || 0}
  <br>

  Derrotas: ${p.derrotas || 0}
  <br>

  Competencias: ${p.competencias || 0}
  <br><br>

  ${tipo === "anual"
            ? `
      Promedio día:
      ${(p.puntos / diasTotales).toFixed(1)}
      <br>

      Promedio semana:
      ${(p.puntos / semanasTotales).toFixed(1)}
      <br>

      Promedio mes:
      ${(p.puntos / mesesTotales).toFixed(1)}
    `
            : ""
          }

  ${tipo === "mensual"
            ? `
      Promedio día:
      ${(p.puntos / diasTotales).toFixed(1)}
      <br>

      Promedio semana:
      ${(p.puntos / semanasTotales).toFixed(1)}
    `
            : ""
          }

  ${tipo === "semanal"
            ? `
      Promedio día:
      ${(p.puntos / diasTotales).toFixed(1)}
    `
            : ""
          }

</div>

      </div>
    `;
      });

      html += `
    <button onclick="cambiarPantalla('eventos')" style="
      width:100%;
      padding:12px;
      background:#222;
      color:#fff;
      border:none;
      border-radius:10px;
      margin-top:15px;
    ">
      Volver
    </button>
  `;

      cambiarContenidoConAnimacion(html, "adelante");
    }

  </script>
